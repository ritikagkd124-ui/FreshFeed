<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FreshFeed</title>
<meta name="description" content="Packaging advice for farmers and small food businesses">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hind:wght@400;500;600;700&display=swap">
<style>:root {
  --ground: #F6F4EC;
  --card: #FFFFFF;
  --ink: #1B2E22;
  --muted: #4E5B52;
  --line: #DDD8C8;
  --green: #2E6B45;
  --green-dark: #1F4D31;
  --green-soft: #E3EFE5;
  --amber-soft: #FBEBD0;
  --amber-ink: #7A4508;
  --red-soft: #F9E3DF;
  --red-ink: #7E2519;
  --blue-soft: #EAF0F7;
  --blue-ink: #1C3857;
  --paper: #E9E6DA;
  --display: 'Fraunces', Georgia, serif;
  --body: 'Hind', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --gutter: 32px;
}

* { box-sizing: border-box; }
html { color-scheme: light; }
html, body { margin: 0; padding: 0; background: var(--ground); color: var(--ink); font-family: var(--body); -webkit-text-size-adjust: 100%; }
button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
a { color: var(--green); text-decoration: none; }
a:hover { color: var(--green-dark); }
button { cursor: pointer; }
button:disabled { cursor: default; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #D08A2C; outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- frame ---------- */
.app { min-height: 100vh; display: flex; flex-direction: column; }
.container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 var(--gutter); }
main.container { flex: 1; }
.page { display: flex; flex-direction: column; gap: 16px; padding: 24px 0 40px; }

.header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(246,244,236,0.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.header-inner { display: flex; align-items: center; gap: 24px; height: 72px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: none; padding: 0; color: var(--ink); }
.brand-mark { width: 40px; height: 40px; border-radius: 12px; background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; }
.brand-name { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -0.2px; }
.header-nav { display: flex; gap: 4px; margin-left: 12px; }
.header-nav button { background: none; border: none; height: 44px; padding: 0 16px; border-radius: 10px; font-size: 16px; font-weight: 500; color: var(--muted); }
.header-nav button:hover { background: #ECE8DC; color: var(--ink); }
.header-nav button[aria-current="page"] { color: var(--ink); font-weight: 700; background: #ECE8DC; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }

.footer { border-top: 1px solid var(--line); padding: 20px 0 28px; margin-top: 16px; }
.footer-inner { display: flex; justify-content: space-between; gap: 24px; align-items: baseline; }
.footer-inner > span:first-child { font-weight: 700; }

.desktop-only { display: flex; }
.mobile-only { display: none !important; }

/* ---------- type ---------- */
h1.display { margin: 0; font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.12; letter-spacing: -0.4px; }
.section-title { margin: 0 0 14px; font-family: var(--display); font-size: 24px; font-weight: 700; }
.sub { font-size: 18px; line-height: 1.5; color: var(--muted); margin: 0; }
.small { font-size: 14px; color: var(--muted); line-height: 1.45; }
.label-caps { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }

/* ---------- controls ---------- */
.lang { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { min-width: 44px; height: 36px; border: none; border-radius: 999px; background: transparent; font-weight: 600; font-size: 15px; }
.lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }

.btn-primary { height: 56px; padding: 0 24px; border-radius: 14px; background: var(--green); color: #fff; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 700; white-space: nowrap; }
.btn-primary:hover { background: var(--green-dark); color: #fff; }
.btn-primary:disabled { background: #9DB3A5; }
.btn-dark { height: 56px; padding: 0 20px; border-radius: 14px; background: var(--ink); color: #fff; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; }
.btn-dark:hover { color: #fff; background: #0f1d15; }
.btn-light { height: 56px; padding: 0 20px; border-radius: 14px; background: var(--card); color: var(--ink); border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; }
.btn-light:hover { border-color: var(--green); }
.btn-sm { height: 44px; padding: 0 16px; font-size: 15px; border-radius: 12px; }
.btn-square { width: 52px; height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--green); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.btn-square[aria-pressed="true"] { background: var(--green); color: #fff; border-color: var(--green); }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--ink); flex-shrink: 0; }
.link-btn { background: none; border: none; color: var(--green); font-weight: 600; font-size: 16px; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; }

.search { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; color: var(--muted); flex: 1; }
.search input { border: none; outline: none; background: transparent; font-size: 16px; color: var(--ink); flex: 1; min-width: 0; height: 100%; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { height: 42px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 15px; font-weight: 500; white-space: nowrap; }
.chip:hover { border-color: var(--green); }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }

.data-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.data-badge i { width: 8px; height: 8px; border-radius: 50%; background: #B08A5B; display: inline-block; }
.data-badge.live i { background: var(--green); }
.dot { border-radius: 50%; flex-shrink: 0; display: inline-block; }

/* ---------- cards & boxes ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.card h2 { margin: 0; font-size: 18px; font-weight: 700; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }

.box-red, .box-amber, .box-blue { border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.box-red { background: var(--red-soft); color: var(--red-ink); }
.box-amber { background: var(--amber-soft); color: var(--amber-ink); }
.box-blue { background: var(--blue-soft); color: var(--blue-ink); }
.box-title { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; }
.box-line { font-size: 16px; line-height: 1.5; display: flex; gap: 8px; }
.box-line::before { content: '•'; flex-shrink: 0; }
.inline-warn { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; margin-top: 12px; border-radius: 12px; background: var(--amber-soft); color: var(--amber-ink); font-size: 15px; line-height: 1.4; }

/* ---------- home ---------- */
.home-hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 48px; align-items: center; padding: 24px 0 8px; }
.home-hero-text { display: flex; flex-direction: column; gap: 18px; }
.hero-title { font-size: 56px !important; line-height: 1.04 !important; letter-spacing: -1px !important; }
.hero-sub { font-size: 20px; max-width: 520px; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.home-hero-cards { display: flex; flex-direction: column; gap: 14px; }
.hero-cta { display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 22px; background: var(--green); color: #fff; border: none; text-align: left; width: 100%; }
.hero-cta:hover { background: var(--green-dark); }
.hero-cta-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.hero-cta-title { font-size: 24px; font-weight: 700; line-height: 1.2; }
.hero-cta-sub { font-size: 16px; opacity: 0.92; }
.round-white { width: 48px; height: 48px; border-radius: 50%; background: #fff; color: var(--green); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tile-link { display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); color: var(--ink); min-height: 150px; text-align: left; }
.tile-link:hover { border-color: var(--green); }
.tile-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.tile-title { font-size: 17px; font-weight: 700; line-height: 1.2; }

.how { padding-top: 8px; }
.how-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.how-item { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
.how-item p { margin: 0; font-size: 16px; line-height: 1.5; }
.how-num { width: 36px; height: 36px; border-radius: 50%; background: var(--green-soft); color: var(--green); font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.home-lower { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.home-lower > .data-strip:only-child { grid-column: 1 / -1; }
.recent-list { display: flex; flex-direction: column; gap: 10px; }
.row-link { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; color: var(--ink); width: 100%; text-align: left; }
.row-link:hover { border-color: var(--green); }
.data-strip { display: flex; flex-direction: column; gap: 12px; }
.data-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.data-stats div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; }
.data-stats b { font-family: var(--display); font-size: 30px; line-height: 1.1; color: var(--green-dark); }
.data-stats span { font-size: 14px; color: var(--muted); }

/* ---------- wizard ---------- */
.wizard { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 32px; padding: 24px 0 40px; align-items: start; }
.wizard-side { position: sticky; top: 104px; flex-direction: column; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.steps button { display: flex; gap: 12px; align-items: flex-start; width: 100%; background: none; border: none; text-align: left; padding: 10px 8px; border-radius: 12px; color: var(--ink); }
.steps button:not(:disabled):hover { background: var(--ground); }
.steps li.cur button { background: var(--green-soft); }
.step-num { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; color: var(--muted); background: var(--card); }
.steps li.cur .step-num { border-color: var(--green); color: var(--green); }
.steps li.done .step-num { background: var(--green); border-color: var(--green); color: #fff; }
.step-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.step-name { font-size: 15px; font-weight: 700; }
.step-val { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.wizard-main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.stepbar { display: flex; align-items: center; gap: 14px; }
.progress { display: grid; gap: 6px; }
.progress span { height: 6px; border-radius: 3px; background: var(--line); }
.progress span.on { background: var(--green); }
.step-body { display: flex; flex-direction: column; gap: 18px; }
.pick-tools { display: flex; gap: 10px; align-items: center; max-width: 640px; }
.mic-banner { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--blue-soft); color: var(--blue-ink); font-size: 15px; }

.produce-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 8px 14px; min-height: 124px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-align: center; }
.tile:hover { border-color: var(--green); }
.tile[aria-pressed="true"] { border: 3px solid var(--green); padding: 14px 6px 12px; }
.tile-en { font-size: 15px; font-weight: 600; line-height: 1.15; }
.tile-local { font-size: 14px; color: var(--muted); line-height: 1.15; }

.options-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.options-4 { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.option { display: block; width: 100%; padding: 18px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); text-align: left; }
.option:hover { border-color: var(--green); }
.option[aria-pressed="true"] { border: 3px solid var(--green); padding: 16px; }
.option-row { display: flex; align-items: center; gap: 14px; }
.option-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--green-soft); color: var(--green); }
.option[aria-pressed="true"] .option-icon { background: var(--green); color: #fff; }
.option-title { font-size: 19px; font-weight: 700; line-height: 1.2; }
.option-sub { font-size: 15px; color: var(--muted); line-height: 1.35; }

.bottom-actions { display: flex; gap: 10px; justify-content: flex-end; padding-top: 8px; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 20px; }
.bottom-actions .btn-primary { min-width: 220px; }

/* ---------- result ---------- */
.page-head { display: flex; align-items: center; gap: 16px; }
.head-actions { gap: 10px; }
.result-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.result-grid .col { display: flex; flex-direction: column; gap: 14px; }
.result-hero { padding: 22px; border-radius: 20px; background: var(--green); color: #fff; display: flex; flex-direction: column; gap: 16px; }
.result-hero .pack-name { font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1.12; }
.life-box { display: flex; flex-direction: column; gap: 2px; padding: 16px; border-radius: 14px; background: rgba(255,255,255,0.14); }
.life-box .big { font-size: 28px; font-weight: 700; line-height: 1.2; }
.prot-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 16px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.pill.good { background: var(--green-soft); color: var(--green-dark); }
.pill.neutral { background: #EFEDE5; color: var(--muted); }
.pill .pd { width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
.shop-box { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--ground); border: 1px dashed #BDB6A0; }
.shop-box .txt { font-size: 17px; font-weight: 600; flex: 1; line-height: 1.35; }
.actions-card .btn-light, .actions-card .btn-dark { width: 100%; }

/* ---------- technical ---------- */
.tech-grid { column-count: 2; column-gap: 14px; }
.tech-grid > * { break-inside: avoid; margin-bottom: 14px; width: 100%; }
.stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 1px; padding: 8px 12px; border-radius: 10px; background: var(--ground); }
.stat .k { font-size: 13px; color: var(--muted); }
.stat .v { font-size: 17px; font-weight: 700; line-height: 1.25; }
.bars { display: flex; gap: 12px; align-items: flex-end; height: 140px; padding: 0 4px; border-bottom: 1px solid var(--line); }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; }
.bar-col .n { font-size: 14px; font-weight: 700; }
.bar-col .b { width: 100%; max-width: 72px; border-radius: 6px 6px 0 0; background: #8FB89A; min-height: 2px; }
.bar-col .b.hi { background: var(--green); }
.bar-labels { display: flex; gap: 12px; padding: 0 4px; font-size: 14px; color: var(--muted); text-align: center; }
.bar-labels span { flex: 1; }
.gas3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.gas { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 12px; }
.gas .k { font-size: 13px; }
.gas .v { font-size: 22px; font-weight: 700; }
.formula { padding: 12px; border-radius: 12px; background: var(--ground); font-size: 15px; line-height: 1.5; }
.field { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; font-size: 14px; color: var(--muted); }
.field input, .field select { height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); padding: 0 12px; font-size: 17px; color: var(--ink); width: 100%; }
.otr-result { padding: 16px; border-radius: 14px; background: var(--green-soft); color: var(--green-dark); display: flex; flex-direction: column; gap: 2px; }
.otr-result .big { font-size: 30px; font-weight: 700; }

/* ---------- spec sheet ---------- */
.spec-layout { display: grid; grid-template-columns: minmax(0, 720px) 300px; gap: 24px; align-items: start; }
.sheet { padding: 40px 44px; background: #fff; border-radius: 6px; border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 18px; }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
.sheet-row { display: flex; justify-content: space-between; gap: 24px; padding: 10px 0; border-bottom: 1px solid #ECE8DC; font-size: 15px; }
.sheet-row:last-child { border-bottom: none; }
.sheet-row .k { color: var(--muted); flex-shrink: 0; }
.sheet-row .v { font-weight: 600; text-align: right; }
.qr { width: 120px; height: 120px; flex-shrink: 0; }
.spec-actions { display: flex; flex-direction: column; gap: 10px; position: sticky; top: 104px; }
.spec-actions > * { width: 100%; }
.spec-actions .btn-primary { white-space: normal; height: auto; min-height: 56px; padding: 12px 16px; text-align: center; }

/* ---------- library ---------- */
.lib-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
.lib-search { max-width: 420px; }
.table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.lib-table { width: 100%; border-collapse: collapse; font-size: 15px; }
.lib-table th { text-align: left; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 12px 16px; background: #F9F8F3; border-bottom: 1px solid var(--line); }
.lib-table td { padding: 10px 16px; border-bottom: 1px solid #ECE8DC; vertical-align: middle; }
.lib-table tr:last-child td { border-bottom: none; }
.lib-table tbody tr:hover { background: #FBFAF6; }
.lib-table td:last-child { text-align: right; }
.cell-name { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; }
.lib-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; width: 100%; text-align: left; }
.lib-item .meta { font-size: 13px; color: var(--muted); }

.center-msg { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 17px; padding: 60px 20px; text-align: center; }
.toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 15px; z-index: 50; max-width: 90vw; text-align: center; }

/* ---------- tablet ---------- */
@media (max-width: 1024px) {
  .home-hero { grid-template-columns: 1fr; gap: 24px; }
  .hero-title { font-size: 44px !important; }
  .wizard { grid-template-columns: 220px minmax(0, 1fr); gap: 24px; }
  .tech-grid { column-count: 1; }
  .spec-layout { grid-template-columns: 1fr; }
  .spec-actions { position: static; flex-direction: row; }
}

/* ---------- phone ---------- */
@media (max-width: 760px) {
  :root { --gutter: 18px; }
  .desktop-only { display: none !important; }
  .mobile-only { display: flex !important; }
  .grid2.mobile-only { display: grid !important; }
  .header-inner { height: 64px; gap: 12px; }
  .page { padding: 20px 0 110px; gap: 16px; }
  h1.display { font-size: 28px; }
  .hero-title { font-size: 34px !important; line-height: 1.1 !important; }
  .hero-sub { font-size: 17px; }
  .how-grid, .home-lower { grid-template-columns: 1fr; gap: 12px; }
  .wizard { display: block; padding: 16px 0 24px; }
  .wizard-main { gap: 16px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .produce-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .options-grid, .options-4 { grid-template-columns: 1fr; gap: 12px; }
  .bottom-actions { position: sticky; bottom: 0; border-top: none; background: linear-gradient(rgba(246,244,236,0), var(--ground) 30%); padding: 12px 0 18px; margin-top: 0; }
  .bottom-actions .btn-primary { flex: 1; min-width: 0; }
  .result-grid { grid-template-columns: 1fr; gap: 16px; }
  .result-grid .col { gap: 16px; }
  .result-hero { padding: 20px; }
  .result-hero .pack-name { font-size: 27px; }
  .page-head h1.display { font-size: 24px; }
  .sheet { padding: 22px 18px; }
  .sheet-row { font-size: 14px; gap: 12px; }
  .qr { width: 92px; height: 92px; }
  .spec-actions { flex-direction: column; }
  .lib-head { flex-direction: column; align-items: stretch; gap: 12px; }
  .lib-search { max-width: none; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; justify-content: space-around; padding: 8px 12px 16px; background: var(--card); border-top: 1px solid var(--line); z-index: 15; }
  .nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 72px; min-height: 52px; background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 500; }
  .nav button[aria-current="page"] { color: var(--green); font-weight: 700; }
  .footer { display: none; }
  .toast { bottom: 100px; }
}

@media print {
  .no-print, .nav, .header, .footer, .bottom-actions { display: none !important; }
  body, .app { background: #fff !important; }
  .page { padding: 0; }
  .spec-layout { display: block; }
  .sheet { border: none; box-shadow: none; padding: 0; }
}

/* ---------- feedback ---------- */
.fb-opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fb-opt { min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 600; padding: 6px 8px; text-align: center; }
.fb-opt:hover { border-color: var(--green); }
.fb-opt.fb-worked[aria-pressed="true"] { background: var(--green-soft); border: 2px solid var(--green); color: var(--green-dark); }
.fb-opt.fb-partly[aria-pressed="true"] { background: var(--amber-soft); border: 2px solid #C08A3E; color: var(--amber-ink); }
.fb-opt.fb-failed[aria-pressed="true"] { background: var(--red-soft); border: 2px solid #B4574B; color: var(--red-ink); }
.field textarea { border-radius: 12px; border: 1px solid var(--line); background: var(--card); padding: 10px 12px; font-size: 16px; color: var(--ink); width: 100%; font-family: inherit; resize: vertical; }

/* ---------- estimates ---------- */
.estimate { display: flex; flex-direction: column; gap: 8px; padding-top: 6px; }
.estimate-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 700; }

/* ---------- product icons ---------- */
.produce-icon { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; flex-shrink: 0; }
.produce-icon svg { display: block; }
.tile .produce-icon { margin-bottom: 2px; }
.hero-icons { display: flex; gap: 8px; flex-wrap: wrap; }
.hero-icon { width: 54px; height: 54px; border-radius: 50%; background: #fff; display: inline-flex; align-items: center; justify-content: center; }

/* ---------- spec sheet emphasis ---------- */
.btn-spec { height: 56px; padding: 0 20px; border-radius: 14px; background: #C8741F; color: #fff; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; white-space: nowrap; box-shadow: 0 2px 0 #9A5714; }
.btn-spec:hover { background: #B0651A; }
.btn-spec.btn-sm { height: 44px; padding: 0 16px; font-size: 15px; }
.spec-cta { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 18px; border-radius: 16px; border: none; background: #C8741F; color: #fff; text-align: left; box-shadow: 0 3px 0 #9A5714; }
.spec-cta:hover { background: #B0651A; }
.spec-cta-icon { width: 48px; height: 48px; border-radius: 12px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.spec-cta-text { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.spec-cta-title { font-size: 19px; font-weight: 700; }
.spec-cta-sub { font-size: 14px; opacity: 0.95; line-height: 1.35; }
.actions-card .btn-dark, .actions-card .btn-light { width: 100%; }
